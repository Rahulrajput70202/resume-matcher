# --- Server ---
server.port=8080

# --- Database (H2 in-memory: zero setup, resets on restart, great for demo/dev) ---
spring.datasource.url=jdbc:h2:mem:resumematcher;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- File upload limits ---
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# --- JWT ---
# IMPORTANT: replace with your own Base64-encoded 256-bit+ secret before deploying anywhere real.
# Generate one with: openssl rand -base64 32
app.jwt.secret=cmVzdW1lLW1hdGNoZXItZGV2LXNlY3JldC1rZXktY2hhbmdlLW1lLTEyMzQ1Ng==
app.jwt.expiration-ms=86400000

# --- Optional AI layer (leave blank to disable; core matching works without it) ---
app.ai.api-key=
app.ai.model=claude-sonnet-4-6
app.ai.api-url=https://api.anthropic.com/v1/messages
# ===============================
# Spring AI - Ollama
# ===============================

spring.ai.ollama.base-url=http://localhost:11434

spring.ai.ollama.chat.options.model=llama3.2
spring.ai.ollama.chat.options.temperature=0.2

spring.ai.ollama.embedding.options.model=nomic-embed-text
logging.level.org.springframework.security=DEBUG