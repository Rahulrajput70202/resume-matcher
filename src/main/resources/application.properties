# --- Server ---
server.port=8080

# --- PostgreSQL Database ---
spring.datasource.url=jdbc:postgresql://localhost:5432/resume_matcher
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA ---
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# --- File upload limits ---
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# --- JWT ---
# IMPORTANT: replace with your own Base64-encoded 256-bit+ secret before deploying anywhere real.
app.jwt.secret=cmVzdW1lLW1hdGNoZXItZGV2LXNlY3JldC1rZXktY2hhbmdlLW1lLTEyMzQ1Ng==
app.jwt.expiration-ms=86400000

# --- Optional AI layer ---
app.ai.api-key=
app.ai.model=claude-sonnet-4-6
app.ai.api-url=https://api.anthropic.com/v1/messages

# ===============================
# Spring AI - Ollama
# ===============================

spring.ai.ollama.base-url=http://localhost:11434

spring.ai.ollama.chat.options.model=llama3.2
spring.ai.ollama.chat.options.temperature=0.2

spring.ai.ollama.embedding.options.model=nomic-embed-text

# --- Hybrid resume matching ---
app.matching.keyword-weight=0.50
app.matching.semantic-weight=0.50
app.matching.semantic-top-k=5

# --- Logging ---
logging.level.org.springframework.security=DEBUG
