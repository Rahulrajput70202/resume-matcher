# Run with: java -jar app.jar --spring.profiles.active=mysql
# Create the DB first: CREATE DATABASE resumematcher;

spring.datasource.url=jdbc:mysql://localhost:3306/resumematcher?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=your_mysql_password

spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

spring.h2.console.enabled=false
